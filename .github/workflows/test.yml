name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Only the suites that need no published packages.
  #
  # Most of this repository's tests need @fitfak/ssl, @fitfak/database or @fitfak/qr, none of
  # which are published yet, so a job that ran `npm test` would fail on packaging rather than on
  # code and would be ignored within a week. These two need nothing beyond a sibling checkout:
  # the redirect and authorization-code rules are pure string handling, and the short-lived
  # identity rules run against the in-memory database double.
  #
  # They are also the two places where a silent regression is most expensive. An unregistered
  # redirect URI reaching an authorization request is an open redirect; a renewal that stops
  # re-checking the authority behind it turns a five-minute certificate into a year-old
  # decision. Both keep working right up until they do not.
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      # Both repositories are checked out side by side, because core/spiffe.js resolves
      # @fitfak/database and falls back to `../database` when the package is not installed.
      # The SPIFFE parser is shared with that repository on purpose: two parsers would
      # eventually read one certificate as two different identities.
      - uses: actions/checkout@v4
        with:
          path: idp

      - uses: actions/checkout@v4
        id: database
        continue-on-error: true
        with:
          repository: AybarsYldrm/database
          # The matching branch first, so a change that spans both repositories is tested
          # against itself rather than against whatever is on main.
          ref: ${{ github.head_ref || github.ref_name }}
          path: database

      - name: Fall back to the default branch of @fitfak/database
        if: steps.database.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: AybarsYldrm/database
          path: database

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Redirect handles and authorization codes
        working-directory: idp
        run: npm run test:redirects

      - name: Short-lived workload identities
        working-directory: idp
        run: npm run test:workload

      # The identity provider resolves @fitfak/database as a package. The checkout above puts
      # it beside this repository, so it has to be linked in before anything that opens the
      # encrypted secret store can run.
      # The signing library. It was pinned at ^1.0.2 while the library moved to 2.x, so the range
      # never installed the new one and certificates came out not matching the CSR's private key
      # -- a fault with no symptom until a TLS handshake somewhere else. Checked out here so the
      # PKI suites run against the version the code actually declares.
      - uses: actions/checkout@v4
        with:
          repository: AybarsYldrm/ssl
          path: ssl

      - name: Link @fitfak/database and @fitfak/ssl
        working-directory: idp
        run: |
          mkdir -p node_modules/@fitfak
          ln -sfn "$GITHUB_WORKSPACE/database" node_modules/@fitfak/database
          ln -sfn "$GITHUB_WORKSPACE/ssl" node_modules/@fitfak/ssl

      # The check that would have caught the version drift: an issued certificate must belong to
      # the private key that asked for it.
      - name: Signing library produces certificates that match their key
        working-directory: idp
        run: npm run test:ssl-compat

      - name: Revocation reaches a validator (openssl)
        working-directory: idp
        run: npm run test:revocation

      - name: Certificate Transparency issuance
        working-directory: idp
        run: npm run test:ct

      - name: Startup buffer — work before the database exists
        working-directory: idp
        run: npm run test:staging

      - name: Keys in the encrypted vault, not in .keys/
        working-directory: idp
        run: npm run test:key-vault

      # The one that catches a class of bug with no symptom: a certificate carrying an address
      # that does not answer. Chain building and revocation both fail silently when it happens.
      - name: Certificate distribution points
        working-directory: idp
        run: npm run test:crl-distribution

      # A browser app could not read userinfo at all: the allowed-origin list was a hardcoded
      # pair that never included the portal, and the endpoint only read a SameSite cookie the
      # browser will not send cross-site.
      - name: CORS origins and Bearer userinfo
        working-directory: idp
        run: npm run test:cors

      # The identifier step must not ask the server anything: the obvious implementation of
      # "email first" is an account-enumeration oracle.
      - name: Staged login and second-factor selection
        working-directory: idp
        run: npm run test:login-steps

      # A handle that resolves only against a closed list makes open redirect inexpressible
      # rather than merely blocked.
      - name: Internal redirect handles
        working-directory: idp
        run: npm run test:internal-redirects
